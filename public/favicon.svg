<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Laurel Wreath -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6B846" />
      <stop offset="50%" stop-color="#E29A26" />
      <stop offset="100%" stop-color="#C57E12" />
    </linearGradient>

    <!-- Navy Gradient for Graduation Cap -->
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2B5C" />
      <stop offset="100%" stop-color="#0A1D3F" />
    </linearGradient>
    
    <g id="favLeaf">
      <path d="M0,0 C-3,-10 -9,-17 -20,-20 C-13,-10 -10,-3 0,0 Z" fill="url(#favGold)" />
      <path d="M0,0 C3,-10 9,-17 20,-20 C13,-10 10,-3 0,0 Z" fill="url(#favGold)" />
    </g>
  </defs>

  <!-- Background circle (subtle clean contrast) -->
  <circle cx="160" cy="160" r="156" fill="#FFFFFF" />

  <!-- Laurel Wreath -->
  <g transform="translate(160, 160)">
    <!-- Branch stems -->
    <path d="M-12,110 C-65,100 -120,55 -120,-15 C-120,-60 -85,-100 -25,-120" fill="none" stroke="#E29A26" stroke-width="3.5" stroke-linecap="round" />
    <path d="M12,110 C65,100 120,55 120,-15 C120,-60 85,-100 25,-120" fill="none" stroke="#E29A26" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Crossed bottom stems -->
    <path d="M-20,105 L12,125 M20,105 L-12,125" stroke="#C57E12" stroke-width="3.5" stroke-linecap="round" />

    <!-- Left Leaves along the arc -->
    <g transform="translate(-25, -120) rotate(-40)"><use href="#favLeaf" transform="scale(0.8)" /></g>
    <g transform="translate(-55, -108) rotate(-55)"><use href="#favLeaf" transform="scale(0.85)" /></g>
    <g transform="translate(-80, -88) rotate(-70)"><use href="#favLeaf" transform="scale(0.9)" /></g>
    <g transform="translate(-100, -60) rotate(-85)"><use href="#favLeaf" transform="scale(0.95)" /></g>
    <g transform="translate(-112, -28) rotate(-100)"><use href="#favLeaf" transform="scale(1)" /></g>
    <g transform="translate(-116, 8) rotate(-115)"><use href="#favLeaf" transform="scale(1)" /></g>
    <g transform="translate(-110, 44) rotate(-130)"><use href="#favLeaf" transform="scale(0.95)" /></g>
    <g transform="translate(-94, 76) rotate(-145)"><use href="#favLeaf" transform="scale(0.9)" /></g>
    <g transform="translate(-68, 100) rotate(-160)"><use href="#favLeaf" transform="scale(0.85)" /></g>
    <g transform="translate(-36, 112) rotate(-175)"><use href="#favLeaf" transform="scale(0.8)" /></g>

    <!-- Right Leaves along the arc -->
    <g transform="translate(25, -120) rotate(40) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.8)" /></g>
    <g transform="translate(55, -108) rotate(55) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.85)" /></g>
    <g transform="translate(80, -88) rotate(70) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.9)" /></g>
    <g transform="translate(100, -60) rotate(85) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.95)" /></g>
    <g transform="translate(112, -28) rotate(100) scale(-1, 1)"><use href="#favLeaf" transform="scale(1)" /></g>
    <g transform="translate(116, 8) rotate(115) scale(-1, 1)"><use href="#favLeaf" transform="scale(1)" /></g>
    <g transform="translate(110, 44) rotate(130) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.95)" /></g>
    <g transform="translate(94, 76) rotate(145) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.9)" /></g>
    <g transform="translate(68, 100) rotate(160) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.85)" /></g>
    <g transform="translate(36, 112) rotate(175) scale(-1, 1)"><use href="#favLeaf" transform="scale(0.8)" /></g>
  </g>

  <!-- Central Graduation Cap (Mortarboard) -->
  <g transform="translate(160, 150)">
    <!-- Cap Top Diamond Plane -->
    <path d="M0,-52 L72,-16 L0,20 L-72,-16 Z" fill="url(#favNavy)" />
    
    <!-- Cap Lower Bevel / Under-edge -->
    <path d="M-72,-16 L0,20 L0,26 L-72,-10 Z" fill="#0A1D3F" opacity="0.9" />
    <path d="M0,20 L72,-16 L72,-10 L0,26 Z" fill="#142B63" opacity="0.9" />

    <!-- Cap Base (Skull cap) -->
    <path d="M-42,0 L0,21 L42,0 L42,34 L0,55 L-42,34 Z" fill="url(#favNavy)" />
    
    <!-- White Fold / Chevron Accent inside Cap -->
    <path d="M-35,6 L0,24 L35,6 L35,14 L0,32 L-35,14 Z" fill="#FFFFFF" />
    
    <!-- Tassel Button at Center Top -->
    <ellipse cx="0" cy="-16" rx="4" ry="2.5" fill="#0A1D3F" />
    
    <!-- Tassel Ribbon / Hanging Tassel on Right -->
    <path d="M0,-16 Q45,-8 53,12 L53,42" fill="none" stroke="#0A1D3F" stroke-width="3.5" stroke-linecap="round" />
    <!-- Tassel Band and Fringe -->
    <rect x="50" y="40" width="6.5" height="3" rx="1" fill="#E29A26" />
    <path d="M49,43 L57,43 L59,56 L47,56 Z" fill="#0A1D3F" />
  </g>
</svg>
